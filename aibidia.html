  <style>
    body { background: radial-gradient(circle at center, #fafcff 0%, #ebf2ff 100%); }
    html.dark body { background: radial-gradient(circle at center, #111318 0%, #0d1017 100%) !important; }
    header { background-color: rgba(250,252,255,0.92) !important; }
    html.dark header { background-color: rgba(14,16,20,0.92) !important; }
    .section-label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 12px; }
    html.dark .section-label { color: #666; }
    .media-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: flex-start;
    }
    .media-row video,
    .media-row img {
      flex: 1;
      min-width: 0;
      border-radius: 8px;
      display: block;
      width: 100%;
    }
    .media-row img { cursor: zoom-in; }
    @media (max-width: 600px) {
      .media-row { flex-direction: column; }
    }
    .zoomable {
      cursor: zoom-in;
      border-radius: 8px;
      display: block;
      width: 100%;
    }
    /* Lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lb.open { display: flex; }
    #lb img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);
    }
    #lb-close {
      position: fixed;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }
    #lb-close:hover { opacity: 1; }
    /* Manual-play video wrapper */
    .video-wrap {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }
    .video-wrap video {
      width: 100%;
      display: block;
      border-radius: 8px;
    }
    .play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.28);
      transition: background 0.2s;
    }
    .play-btn svg {
      width: 52px;
      height: 52px;
      fill: rgba(255,255,255,0.9);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      transition: transform 0.15s;
    }
    .video-wrap:hover .play-btn { background: rgba(0,0,0,0.18); }
    .video-wrap:hover .play-btn svg { transform: scale(1.08); }
    .play-btn.hidden { display: none; }
  </style>

  <script src="scripts.js?v=20260608"></script>

  <script>
    // Lightbox
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    const lbClose = document.getElementById('lb-close');

    function openLb(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt || '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    document.querySelectorAll('.zoomable').forEach(img => {
      img.addEventListener('click', () => openLb(img.src, img.alt));
    });
    lbClose.addEventListener('click', closeLb);
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
  </script>

  <script>
    window.addEventListener('load', function () {
      document.body.classList.add('loaded');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const elements = document.querySelectorAll('.fade-slide-up');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      elements.forEach(el => observer.observe(el));

      document.querySelectorAll('.video-wrap').forEach(wrap => {
        const video = wrap.querySelector('video');
        const btn = wrap.querySelector('.play-btn');
        wrap.addEventListener('click', () => {
          if (video.paused) {
            video.play();
            btn.classList.add('hidden');
          } else {
            video.pause();
            btn.classList.remove('hidden');
          }
        });
        video.addEventListener('ended', () => btn.classList.remove('hidden'));
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('a');
      links.forEach(link => {
        const href = link.getAttribute('href');
        const isInternal = link.hostname === window.location.hostname;
        const isAnchor = href && href.startsWith('#');
        const isMailto = href && href.startsWith('mailto:');
        if (isInternal && !link.target && !isAnchor && !isMailto) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            requestAnimationFrame(() => {
              document.body.classList.remove('loaded');
              setTimeout(() => {
                window.location.href = href;
              }, 600);
            });
          });
        }
      });
    });
  </script>
