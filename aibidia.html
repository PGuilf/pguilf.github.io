  <style>
    .media-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: flex-start;
    }
    .media-row video,
    .media-row img {
      flex: 1;
      min-width: 0;

    }
    .media-row img { cursor: zoom-in; }
    @media (max-width: 600px) {

    .section-label {
      font-family: 'Montserrat', sans-serif;

      font-weight: 700;

    }
    .zoomable {
      cursor: zoom-in;
      border-radius: 8px;
      display: block;
      width: 100%;

    /* Lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lb.open { display: flex; }
    #lb img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);

    #lb-close {

      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;

  <script src="scripts.js?v=20260608"></script>

  <script>
    // Lightbox
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    const lbClose = document.getElementById('lb-close');

    function openLb(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt || '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    document.querySelectorAll('.zoomable').forEach(img => {
      img.addEventListener('click', () => openLb(img.src, img.alt));
    });
    lbClose.addEventListener('click', closeLb);
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
  </script>

  <script>
    window.addEventListener('load', function () {
      document.body.classList.add('loaded');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const elements = document.querySelectorAll('.fade-slide-up');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      elements.forEach(el => observer.observe(el));

      const videoObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const video = entry.target;
            video.querySelectorAll('source[data-src]').forEach(source => {
              source.src = source.dataset.src;
              source.removeAttribute('data-src');
            });
            video.load();
            video.play();
            videoObserver.unobserve(video);
          }
        });
      }, { rootMargin: '200px' });
      document.querySelectorAll('.lazy-video').forEach(v => videoObserver.observe(v));
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('a');
      links.forEach(link => {
        const href = link.getAttribute('href');
        const isInternal = link.hostname === window.location.hostname;
        const isAnchor = href && href.startsWith('#');
        const isMailto = href && href.startsWith('mailto:');
        if (isInternal && !link.target && !isAnchor && !isMailto) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            requestAnimationFrame(() => {
              document.body.classList.remove('loaded');
              setTimeout(() => {
                window.location.href = href;
              }, 600);
            });
          });
        }
      });
    });
  </script>
