  <script>
    window.addEventListener('load', function () {
      document.body.classList.add('loaded');
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const elements = document.querySelectorAll('.fade-slide-up');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      elements.forEach(el => observer.observe(el));

      const videoObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const video = entry.target;
            video.querySelectorAll('source[data-src]').forEach(source => {
              source.src = source.dataset.src;
              source.removeAttribute('data-src');
            });
            video.load();
            video.play();
            videoObserver.unobserve(video);
          }
        });
      }, { rootMargin: '200px' });
      document.querySelectorAll('.lazy-video').forEach(v => videoObserver.observe(v));
    });
  </script>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('a');
      links.forEach(link => {
        const href = link.getAttribute('href');
        const isInternal = link.hostname === window.location.hostname;
        const isAnchor = href && href.startsWith('#');
        const isMailto = href && href.startsWith('mailto:');
        if (isInternal && !link.target && !isAnchor && !isMailto) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            requestAnimationFrame(() => {
              document.body.classList.remove('loaded');
              setTimeout(() => {
                window.location.href = href;
              }, 600);
            });
          });
        }
      });
    });
  </script>
